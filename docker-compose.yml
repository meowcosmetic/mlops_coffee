services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drinkbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-drinkbot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drinkbot} -d ${POSTGRES_DB:-drinkbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://drinkbot:change-me@postgres:5432/drinkbot}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
  
  adminer:
    image: adminer:latest
    ports:
      - "7000:8080"
    depends_on:
      - postgres

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./LANGFUSE_INTEGRATION_GUIDE.html:/usr/share/nginx/html/LANGFUSE_INTEGRATION_GUIDE.html:ro
      - ./PROJECT_REVIEW_REPORT.html:/usr/share/nginx/html/PROJECT_REVIEW_REPORT.html:ro
    depends_on:
      - backend
      - frontend
      - adminer

volumes:
  pgdata:

