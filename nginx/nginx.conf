upstream frontend_upstream {
    server frontend:80;
}

upstream backend_upstream {
    server backend:8000;
}

upstream adminer_upstream {
    server adminer:8080;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Common Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Extended timeouts for LLM streaming and batch benchmark evals
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Backend API Routing
    location /api/ {
        proxy_pass http://backend_upstream/api/;
        proxy_buffering off;
    }

    # Swagger & OpenAPI Documentation
    location /docs {
        proxy_pass http://backend_upstream/docs;
    }

    location /redoc {
        proxy_pass http://backend_upstream/redoc;
    }

    location /openapi.json {
        proxy_pass http://backend_upstream/openapi.json;
    }

    # Adminer Database GUI
    location /adminer/ {
        proxy_pass http://adminer_upstream/;
    }

    # Direct static documentation files
    location = /LANGFUSE_INTEGRATION_GUIDE.html {
        root /usr/share/nginx/html;
    }

    location = /PROJECT_REVIEW_REPORT.html {
        root /usr/share/nginx/html;
    }

    # Frontend Single Page App (Root)
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
